services:
  api:
    build: .
    command: ["pytest", "--cov=app", "-v"]
    env_file: .env.test
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moderator
      POSTGRES_PASSWORD: moderator
      POSTGRES_DB: test_moderator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moderator"]
      interval: 5s
      timeout: 5s
      retries: 5
